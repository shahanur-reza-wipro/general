# GitLab CI/CD pipeline configuration
# Placeholder file created to match project structure from reference image.

stages:
  - build
  - test
  - deploy
  - package

download-urllib3:
  stage: package
  image: python:3.11-slim
  script:
    - mkdir -p packages
    - pip download urllib3 --no-binary=:all: -d packages/
    - echo "Downloaded packages:"
    - ls -lh packages/
  artifacts:
    name: "urllib3-latest"
    paths:
      - packages/
    expire_in: 7 days
  rules:
    - when: manual
